<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- candlestick 1 (green, left) -->
  <line x1="7" y1="5" x2="7" y2="8" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="4.5" y="8" width="5" height="9" rx="0.5" fill="#3fb950"/>
  <line x1="7" y1="17" x2="7" y2="21" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
  <!-- candlestick 2 (orange/price, center) -->
  <line x1="16" y1="4" x2="16" y2="7" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="13.5" y="7" width="5" height="13" rx="0.5" fill="#f0883e"/>
  <line x1="16" y1="20" x2="16" y2="24" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- candlestick 3 (red, right) -->
  <line x1="25" y1="9" x2="25" y2="12" stroke="#f85149" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="22.5" y="12" width="5" height="8" rx="0.5" fill="#f85149"/>
  <line x1="25" y1="20" x2="25" y2="24" stroke="#f85149" stroke-width="1.5" stroke-linecap="round"/>
  <!-- baseline -->
  <line x1="2" y1="27" x2="30" y2="27" stroke="#f0883e" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
