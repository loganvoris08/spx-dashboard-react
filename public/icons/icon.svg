<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="72" fill="#080c14"/>
  <!-- SPX text -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="188" fill="white">SPX</text>
  <!-- CMD text (dimmed layer behind line) -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="116" letter-spacing="14" fill="rgba(255,255,255,0.12)">CMD</text>
  <!-- Price line crossing through -->
  <polyline points="40,310 100,254 150,284 196,212 240,180 288,226 338,154 394,196 472,134" fill="none" stroke="#00ff88" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Endpoint dot -->
  <circle cx="472" cy="134" r="13" fill="#00ff88"/>
  <circle cx="472" cy="134" r="24" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.35"/>
  <!-- CMD text (bright layer on top) -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="116" letter-spacing="14" fill="#00ff88">CMD</text>
</svg>
